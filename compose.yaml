services:
  api:
    build: .
    command: uvicorn dtc.api:app --host 0.0.0.0 --port 8000
    environment:
      DTC_CONFIG: /app/config/project.yaml
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
      - ./config:/app/config:ro
  web:
    build: .
    command: streamlit run src/dtc/web.py --server.address 0.0.0.0 --server.port 8501
    environment:
      DTC_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
