[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dtc-air-hotel"
version = "0.1.0"
description = "Explainable Abu Dhabi air-to-hotel scenario simulator"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0",
  "joblib==1.6.0",
  "numpy==2.5.3",
  "openpyxl==3.1.5",
  "pandas==2.3.3",
  "plotly==6.9.0",
  "pydantic==2.14.0",
  "PyYAML==6.0.3",
  "requests==2.34.2",
  "scikit-learn==1.9.1",
  "streamlit==1.65.0",
  "uvicorn==0.54.0",
  "xgboost==3.4.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[project.scripts]
dtc = "dtc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
